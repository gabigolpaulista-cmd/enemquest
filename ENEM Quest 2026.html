mk("h","Com o AI-5 (1968), o regime militar ampliou seus poderes: pôde fechar o Congresso, suspender direitos políticos e intensificar a censura. Esse ato representou",["a volta da democracia","o endurecimento da ditadura, com censura e perseguição a opositores","a convocação de eleições diretas","a ampliação da liberdade de imprensa","o fim da censura prévia"],1,"O AI-5 inaugurou o período mais repressivo do regime."),
mk("h","A Primeira Revolução Industrial, iniciada na Inglaterra no século XVIII, mudou as relações de trabalho. Uma de suas consequências foi",["o fortalecimento do artesanato doméstico","a formação do proletariado urbano e a intensa urbanização","o fim da divisão do trabalho","a volta do trabalho servil","a redução do êxodo rural"],1,"As fábricas atraíram camponeses para as cidades e criaram a classe operária."),
mk("h","A queda do Muro de Berlim (1989) simbolizou o declínio do bloco soviético. Esse processo está ligado",["à vitória do socialismo sobre o capitalismo","ao fim da Guerra Fria e à reunificação alemã","à criação da OTAN","ao início da Primeira Guerra","à divisão definitiva da Alemanha"],1,"O Muro caiu em 1989; a Alemanha se reunificou em 1990 e a URSS acabou em 1991."),
mk("g","A pecuária extensiva, a grilagem e o garimpo ilegal impulsionam o desmatamento na Amazônia. Uma medida eficaz de combate é",["flexibilizar a fiscalização ambiental","fortalecer a fiscalização e a regularização fundiária","abrir estradas sem controle","extinguir unidades de conservação","incentivar a grilagem"],1,"Fiscalização e ordenamento fundiário reduzem a ocupação ilegal."),
mk("g","Quando cidades vizinhas crescem até se unir em uma área urbana contínua, como ocorre em grandes metrópoles brasileiras, o fenômeno é chamado de",["conurbação","êxodo rural","transumância","desertificação","enclave"],0,"Conurbação é a união física de áreas urbanas de municípios vizinhos."),
mk("g","Pessoas que deixam seu país por guerras, perseguições ou desastres, em busca de proteção em outro Estado, vivem uma situação de",["turismo","migração pendular","refúgio","transumância","êxodo rural"],2,"Refugiados saem por fundado temor de perseguição ou violência."),
mk("f","Para Hobbes, no estado de natureza há uma ameaça constante de “guerra de todos contra todos”. Para garantir a paz, os indivíduos",["abolem qualquer governo","transferem poder a um soberano por meio do contrato social","voltam ao estado de natureza","dependem só da moral individual","recusam toda lei"],1,"O contrato cria o Estado (Leviatã) em troca de segurança."),
mk("f","Na alegoria da caverna, de Platão, o prisioneiro que sai e vê a luz do sol representa",["o triunfo da aparência","o filósofo que alcança o conhecimento verdadeiro","o desprezo pela razão","o poder político absoluto","a dependência das sombras"],1,"A saída da caverna simboliza a passagem da opinião ao conhecimento."),
mk("f","Sartre afirma que “a existência precede a essência”. Isso significa que o ser humano",["nasce com natureza definida","constrói a si mesmo por suas escolhas e responde por elas","é determinado pela vontade divina","não possui liberdade","tem destino fixo"],1,"No existencialismo, somos livres e responsáveis pelo que fazemos de nós."),
mk("s","Para Marx, a história é marcada pela luta de classes. No capitalismo, a oposição central se dá entre",["clero e nobreza","burguesia, dona dos meios de produção, e proletariado, que vende sua força de trabalho","senhores e servos","patrícios e plebeus","artesãos e mestres"],1,"Quem detém os meios de produção explora a força de trabalho de quem não os tem."),
mk("s","Bourdieu chama de violência simbólica a imposição de valores dominantes que os dominados aceitam como naturais. Um exemplo é",["a punição física","achar que o fracasso escolar é só falta de mérito, ignorando desigualdades de origem","uma greve geral","o confisco de bens","o voto obrigatório"],1,"A desigualdade é legitimada como se fosse mérito individual."),
mk("s","Durkheim chama de anomia o enfraquecimento das normas sociais, que deixam de orientar os indivíduos. O conceito ajuda a entender",["laços comunitários sólidos","crises de valores e desintegração social em mudanças rápidas","a ordem social perfeita","o consenso absoluto","a ausência de conflitos"],1,"A anomia surge quando as normas antigas se desfazem e as novas ainda não se firmaram."),
mk("h","Na República Velha (1889–1930), o poder ficava com as oligarquias. O voto de cabresto consistia em",["voto secreto e obrigatório para todos","pressão dos coronéis sobre os eleitores, que votavam conforme a ordem dos chefes locais","eleição direta com voto feminino","voto universal fiscalizado pela Justiça Eleitoral","sorteio de candidatos"],1,"Era a base do coronelismo: o voto era aberto e controlado pelos poderosos locais."),
mk("h","No Brasil colonial, a economia açucareira se baseou em latifúndio, monocultura de exportação e trabalho escravo. Esse modelo é conhecido como",["plantation","feudalismo","manufatura urbana","economia de subsistência","cooperativismo"],0,"Plantation: grande propriedade monocultora voltada ao mercado externo, com mão de obra escravizada."),
mk("h","Pensadores iluministas como Locke e Montesquieu defendiam limites ao poder dos governantes. Dessas ideias derivou",["o absolutismo de direito divino","a defesa dos direitos naturais e da separação dos poderes","a restauração do feudalismo","o mercantilismo absoluto","a negação da razão"],1,"Locke defendeu direitos naturais; Montesquieu, a separação entre Executivo, Legislativo e Judiciário."),
mk("h","A crise de 1929 e o desemprego em massa favoreceram a ascensão do nazismo na Alemanha, regime marcado por",["pluralismo partidário","partido único, totalitarismo e expansionismo","neutralidade diplomática","descentralização do poder","defesa da igualdade racial"],1,"O nazismo uniu nacionalismo extremo, antissemitismo, culto ao líder e política expansionista."),
mk("g","Em um mapa na escala 1:100.000, cada centímetro no papel corresponde, na realidade, a",["100 metros","1 quilômetro","10 quilômetros","100 quilômetros","10 metros"],1,"1 cm × 100.000 = 100.000 cm = 1.000 m = 1 km."),
mk("g","A matriz elétrica brasileira depende muito de hidrelétricas. Um problema dessa dependência é",["a emissão intensa de carvão","a vulnerabilidade a períodos de seca e os impactos socioambientais de grandes represas","a falta de fontes alternativas possíveis","o alto custo do petróleo importado","a impossibilidade de expandir a energia eólica"],1,"Estiagens reduzem a geração e as represas alagam áreas e deslocam populações."),
mk("g","O Cerrado vem sendo ocupado pela expansão agrícola mecanizada. Uma consequência dessa ocupação é",["a recuperação rápida da vegetação nativa","a perda de biodiversidade e o comprometimento de nascentes","o aumento das áreas de floresta densa","a ausência de impacto sobre os rios","o fim da agricultura de exportação"],1,"A retirada da vegetação nativa reduz a biodiversidade e afeta a recarga dos aquíferos e nascentes."),
mk("g","O envelhecimento da população brasileira decorre da queda da natalidade e do aumento da expectativa de vida. Isso exige do Estado",["reduzir investimentos em saúde","ampliar políticas de saúde, previdência e cuidado à pessoa idosa","estimular apenas o aumento da natalidade","extinguir a aposentadoria","desativar serviços urbanos acessíveis"],1,"Uma população mais velha demanda saúde, previdência e cidades adaptadas."),
mk("f","Nietzsche critica a moral tradicional por reprimir a vida e a criatividade. Em contraposição, propõe",["a obediência cega aos costumes","a criação de novos valores e a afirmação da vida","a negação de toda arte","a submissão à autoridade religiosa","a ausência de qualquer critério"],1,"É a transvaloração dos valores: criar valores que afirmem a vida, em vez de negá-la."),
mk("f","Adorno e Horkheimer denunciam a indústria cultural, que transforma a cultura em mercadoria padronizada para consumo de massa. Para eles, isso",["estimula a reflexão crítica do público","reforça a passividade e a conformação ao sistema","extingue o capitalismo","elimina a publicidade","valoriza só a arte erudita"],1,"A cultura padronizada entretém e acomoda, dificultando o pensamento crítico."),
mk("f","Ao propor a dúvida metódica, Descartes busca uma certeza indubitável, resumida em “penso, logo existo”. Para ele, a razão",["é inferior aos sentidos","é o fundamento seguro do conhecimento","não pode duvidar de nada","depende da tradição","é ilusória"],1,"Descartes é racionalista: duvida de tudo e encontra no pensamento o ponto firme do saber."),
mk("f","Em O Príncipe, Maquiavel analisa como o governante conquista e mantém o poder, separando a política da moral religiosa. Essa visão é considerada",["o início da teoria política moderna, de análise realista do poder","uma defesa do direito divino dos reis","uma crítica ao uso da força","uma proposta de democracia direta","uma negação da política"],0,"Maquiavel estuda a política como ela é, não como deveria ser segundo a moral tradicional."),
mk("s","Weber identifica três tipos de dominação legítima. A autoridade de um líder apoiada em qualidades pessoais admiradas pelos seguidores é a dominação",["legal-racional","carismática","burocrática","tradicional","anômica"],1,"Dominação carismática: baseia-se no prestígio pessoal do líder."),
mk("s","A mobilidade social é a passagem de indivíduos entre posições da estrutura social. Em sociedades muito desiguais, ela tende a ser",["ampla, pois todos partem da mesma situação","limitada por barreiras econômicas, educacionais e de origem","irrelevante para as classes","igual entre todos os grupos","impossível apenas para as elites"],1,"Renda, escolaridade e herança familiar dificultam a ascensão dos mais pobres."),
mk("s","Movimentos sociais, como o negro e o feminista, atuam para ampliar direitos e dar visibilidade a demandas. Sociologicamente, eles",["não têm efeito político","expressam a organização coletiva de grupos que reivindicam mudanças","existem apenas em regimes autoritários","substituem totalmente o Estado","rejeitam qualquer ideia de cidadania"],1,"Movimentos sociais são ação coletiva por reconhecimento e direitos."),

);

ansvaloração dos valores|Apolíneo (ordem e razão) × dionisíaco (instinto e êxtase)|Eterno retorno: viver como se desejasse repetir a própria vida","Questões sobre valores, moral e crise de sentido na modernidade."],["Teoria crítica: analisar a sociedade para transformá-la (Adorno, Horkheimer e Marcuse)|Indústria cultural: cultura como mercadoria padronizada que gera passividade|Razão instrumental: razão voltada ao controle e ao lucro, não à emancipação|Homem unidimensional (Marcuse): o consumo prende o indivíduo ao sistema|Crítica à manipulação pela mídia e pela publicidade","Cai em textos sobre mídia, consumo, redes sociais e cultura de massa."]],
s:[["Fato social: modo de agir, pensar e sentir geral, exterior ao indivíduo e coercitivo|Método: tratar fatos sociais como coisas, com objetividade|Solidariedade mecânica (semelhança) × orgânica (divisão do trabalho)|Anomia: enfraquecimento das normas em mudanças rápidas|Funções sociais da religião e da educação","Aparece em crises de valores, desemprego, violência urbana e normas sociais."],["Ação social: conduta com sentido, orientada pela ação dos outros|Tipos: racional com relação a fins, racional com relação a valores, afetiva e tradicional|Dominação legítima: tradicional, carismática e legal-racional|Burocracia: eficiência, hierarquia e impessoalidade; risco da “jaula de ferro”|A ética protestante e o espírito do capitalismo","Aparece em líderes carismáticos, burocracia e motivações das ações individuais."],["Materialismo histórico: a base econômica condiciona a cultura e a política|Luta de classes: burguesia × proletariado|Mais-valia: o lucro vem do trabalho não pago|Alienação: o trabalhador se afasta do produto, do processo e de si|Ideologia: as ideias dominantes são as da classe dominante","Cobra trabalho, precarização, desigualdade e consumo; liga-se à uberização."],["Capital econômico, cultural, social e simbólico|Habitus: disposições adquiridas que orientam gostos e práticas|Campo social: espaço de disputa por poder e reconhecimento|Violência simbólica: dominação aceita como natural|A escola reproduz desigualdades ao premiar o capital cultural herdado","Desigualdade escolar, acesso à cultura e a falsa ideia de meritocracia."],["Cultura: conjunto de saberes, valores e costumes aprendidos socialmente|Etnocentrismo × relativismo cultural|Identidade, aculturação e hibridismo cultural|Patrimônio material e imaterial e sua preservação|Respeito à diversidade e combate ao preconceito, à intolerância e ao racismo","Cai em intolerância, patrimônio, povos indígenas e culturas populares."],["Estratificação: castas, estamentos e classes; mobilidade social|Desigualdade de renda, gênero e raça; segregação socioespacial|Cidadania: direitos civis, políticos e sociais (Marshall)|Movimentos sociais: negro, feminista, indígena, MST, LGBTQIA+|Estado e políticas afirmativas, como as cotas","Cobra desigualdades e ações coletivas por direitos; fortaleça o repertório com leis e dados."]]};
